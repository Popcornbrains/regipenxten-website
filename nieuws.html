<script>
if (/[?&]qa\b/.test(location.search)) document.documentElement.className = "qa";
/* Een tik vóór de verzendhulp geladen is, wacht even in plaats van een kale POST te worden; de hulp
   verstuurt hem zodra ze er is. Laadt ze niet, dan vertrekt hij alsnog als gewone POST (onerror onderaan). */
document.addEventListener("submit", function (e) {
  var f = e.target;
  if (window.RegiSignup || window.RegiSignupUnavailable || !f.hasAttribute || !f.hasAttribute("data-regi")) return;
  e.preventDefault();
  if (f.hasAttribute("data-pending")) return;
  f.setAttribute("data-pending", "");
  var b = f.querySelector('button[type="submit"]');
  if (b) { b.setAttribute("data-label", b.textContent); b.disabled = true; b.textContent = "Even geduld…"; }
}, true);

<style>
/* ==========================================================================
   /nieuws: de nieuwsbrief, voor wie de QR van de visual "nieuws nieuws nieuws" scant op een
   Milk Inc.-show. Zelfde look als /meetandgreet (Milk Inc. bovenaan, zwart-wit, de foto
   backstage met Linda en Regi); de echo is die visual, zodat je meteen weet dat je juist zit.
   De foto laadt pas na de rest. Nul externe aanvragen behalve de inschrijving zelf.
   ========================================================================== */
:root{
  --ink:#000000;
  --paper:#FFFFFF;
  --mist:rgba(255,255,255,.72);   /* secondary text, 10:1 on black */
  --faint:rgba(255,255,255,.5);   /* footer, 5.9:1 on black */
  --edge:rgba(255,255,255,.42);   /* field outline */

  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;

  --s1:.5rem; --s2:.75rem; --s3:1rem; --s4:1.5rem; --s5:2rem; --s6:3rem;
  --gutter:16px;

  --spring:cubic-bezier(.34,1.56,.64,1);
  --out:cubic-bezier(.22,1,.36,1);

  /* zelfde foto en logo als /meetandgreet; de echo begint net onder Regi's duim */
  --img-h:calc(100vw / .6);
  --pos:50% 0%;
  --logo-x:49.5%;
  --logo-w:27vw;
  --logo-y:calc(var(--img-h) * .055);
  --content-y:calc(var(--img-h) * .57);
  --veil:linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,0) 12%);
}
@media (min-aspect-ratio:4/5){
  :root{
    --img-h:max(calc(100vw / 1.5), 100vh);
    --pos:46.5% 0%;
    --logo-x:46.5%;
    --logo-w:min(calc(var(--img-h) * .17), 230px);
    --logo-y:calc(var(--img-h) * .05);
    --content-y:calc(var(--img-h) * .54);
    --veil:linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,0) 12%, rgba(0,0,0,0) 40%, rgba(0,0,0,.78) 64%, #000 94%);
  }
}
@supports (height:100svh){ @media (min-aspect-ratio:4/5){ :root{ --img-h:max(calc(100vw / 1.5), 100svh); } } }
@media (min-width:640px){ :root{ --gutter:32px; } }

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  position:relative; margin:0; min-height:100vh; background:var(--ink); color:var(--paper);
  font:400 1rem/1.6 var(--font);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
img{ display:block; max-width:100%; height:auto; }
a{ color:inherit; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ---- De foto en het logo ------------------------------------------------- */
.photo{ position:absolute; top:0; left:0; right:0; height:var(--img-h); overflow:hidden; pointer-events:none; }
.photo img{
  width:100%; height:100%; max-width:none; object-fit:cover; object-position:var(--pos);
  opacity:0; transition:opacity 1.1s var(--out);
}
html.photo-in .photo img{ opacity:1; }
/* the corridor behind the logo is darkened a little more (free space around the logo, no shadow on it) */
.photo::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle calc(var(--logo-w) * .95) at var(--logo-x) calc(var(--logo-y) + var(--logo-w) * .65),
      rgba(0,0,0,.72) 40%, rgba(0,0,0,0) 100%),
    var(--veil);
}
.logo{
  position:absolute; z-index:1; top:var(--logo-y); left:var(--logo-x);
  width:var(--logo-w); max-width:none; height:auto; transform:translateX(-50%);
}

/* ---- De inhoud ------------------------------------------------------------ */
.page{
  position:relative; z-index:1; width:100%; max-width:34rem; margin:0 auto;
  padding:var(--content-y) var(--gutter) var(--s6); text-align:center;
}
/* the screen visual, as an echo through the hall: each "nieuws" a step quieter */
.echo{
  margin:0 0 var(--s4);
  font-size:clamp(3.5rem, 17vw, 7rem); font-weight:700; line-height:.84; letter-spacing:-.055em;
  text-shadow:0 2px 28px rgba(0,0,0,.5);
}
.echo span{ display:block; }
.echo span:nth-child(2){ color:var(--mist); }
.echo span:nth-child(3){ color:rgba(255,255,255,.36); }

/* ---- Knoppen: wit, het merk is zwart-wit ---------------------------------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:52px; padding:0 1.65em; border:0; border-radius:999px; cursor:pointer;
  font:700 1rem/1 var(--font); letter-spacing:.005em; text-decoration:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .4s var(--spring), opacity .2s ease, background-color .2s ease, color .2s ease;
}
.btn--solid{ background:var(--paper); color:var(--ink); }
.btn:hover{ transform:translateY(-2px); }
.btn:active{ transform:scale(.96); transition-duration:.12s; }
.btn:focus-visible{ outline:3px solid var(--paper); outline-offset:3px; }
.btn[disabled]{ opacity:.6; cursor:progress; transform:none; }

/* ---- Het formulier (zelfde rij als op de homepage) ------------------------- */
.signup{ margin:0; }
.signup__row{
  display:flex; align-items:center; gap:var(--s1);
  padding:5px; border-radius:999px; background:rgba(0,0,0,.5);
  box-shadow:inset 0 0 0 1.5px var(--edge);
  transition:box-shadow .2s ease, background-color .2s ease;
}
.signup__row:focus-within{ box-shadow:inset 0 0 0 1.5px var(--paper); }
.signup.is-invalid .signup__row{ box-shadow:inset 0 0 0 3px var(--paper); background:rgba(255,255,255,.14); }
.signup input[type="email"]{
  flex:1; min-width:0; height:46px; margin:0; padding:0 0 0 var(--s3);
  border:0; border-radius:999px; background:transparent; color:var(--paper); caret-color:var(--paper);
  font:500 1rem var(--font); outline:none; -webkit-appearance:none; appearance:none;
}
.signup input[type="email"]::placeholder{ color:rgba(255,255,255,.62); }
.signup input[readonly]{ color:var(--mist); }
.signup input:-webkit-autofill{ -webkit-box-shadow:inset 0 0 0 100px #111; -webkit-text-fill-color:var(--paper); }
.signup .btn{ min-height:46px; padding:0 1.3em; flex:none; }
.hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
.fine{ margin:var(--s2) 0 0; font-size:.9375rem; color:var(--mist); text-wrap:balance; }
.fine a{ color:var(--paper); text-underline-offset:3px; border-radius:3px; transition:opacity .2s ease; }
.fine a:hover{ text-decoration-thickness:2px; }
.fine a:active{ opacity:.6; }
.fine a:focus-visible{ outline:2px solid var(--paper); outline-offset:3px; }

.status{ margin:0; font-weight:500; }
.status:not(:empty){ margin-top:var(--s2); }
.signup[data-state="waiting"] .status::before, .signup[data-state="slow"] .status::before{
  content:""; display:inline-block; width:.55em; height:.55em; margin-right:.55em;
  border-radius:50%; background:var(--paper); vertical-align:.05em;
}
@media (prefers-reduced-motion:no-preference){
  .signup[data-state="waiting"] .status::before, .signup[data-state="slow"] .status::before{ animation:pulse 1.2s ease-in-out infinite; }
}
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

/* confirmed: the outlined row is replaced by the same pill, filled white */
.signup[data-state="done"] .signup__row{ display:none; }
.signup[data-state="done"] .status{
  display:flex; align-items:center; justify-content:center; min-height:56px; margin:0; padding:.85rem 1.4rem;
  border-radius:28px; background:var(--paper); color:var(--ink);
  font-size:1.125rem; font-weight:700; line-height:1.3; letter-spacing:-.01em;
}
/* a quiet link, below the confirmation */
.again{
  display:inline-block; margin-top:var(--s5); padding:.5rem .25rem; border:0; background:none; cursor:pointer;
  color:var(--mist); font:600 1rem/1.4 var(--font);
  text-decoration:underline; text-underline-offset:4px; border-radius:4px;
  -webkit-tap-highlight-color:transparent; transition:opacity .2s ease, color .2s ease;
}
.again:hover{ color:var(--paper); }
.again:active{ opacity:.6; }
.again:focus-visible{ outline:2px solid var(--paper); outline-offset:3px; }

/* ---- Footer --------------------------------------------------------------- */
.foot{
  position:relative; z-index:1; margin:0;
  padding:var(--s4) var(--gutter) max(var(--s5), env(safe-area-inset-bottom));
  font-size:.8125rem; color:var(--faint); text-align:center;
}

/* Windows high contrast drops box-shadows: give the field row a real border and focus outline there */
@media (forced-colors:active){
  .signup__row{ border:1px solid CanvasText; }
  .signup__row:focus-within{ outline:2px solid Highlight; outline-offset:2px; }
}

/* load: the logo lands, the echo rolls in word by word, then it is still */
@media (prefers-reduced-motion:no-preference){
  .logo{ animation:land 1s var(--out) both; }
  .echo span{ animation:rise .7s var(--out) both; }
  .echo span:nth-child(2){ animation-delay:.14s; }
  .echo span:nth-child(3){ animation-delay:.28s; }
  .signup[data-state="done"] .status{ animation:pop .6s var(--spring) both; }
}
@media (prefers-reduced-motion:reduce){ .photo img{ transition:none; } }
@keyframes land{ from{ opacity:0; transform:translateX(-50%) scale(1.06); } to{ opacity:1; transform:translateX(-50%); } }
@keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
@keyframes pop{ from{ opacity:0; transform:scale(.97); } to{ opacity:1; transform:none; } }
html.qa *, html.qa *::before, html.qa *::after{ animation:none !important; transition:none !important; }
</style>
</head>
<body>

<!-- Backstage met Linda en Regi: het script zet de bron pas na het laden van de rest. -->
<div class="photo" aria-hidden="true">
  <picture>
    <source media="(min-aspect-ratio: 4/5)" data-srcset="assets/img/milkinc-backstage-1600.jpg 1600w, assets/img/milkinc-backstage-2400.jpg 2400w" sizes="100vw">
    <img data-src="assets/img/milkinc-backstage-p750.jpg" width="750" height="1250" alt="" decoding="async">
  </picture>
</div>
<img class="logo" src="assets/milkinc/milkinc-logo-wit.png" width="389" height="507" alt="Milk Inc.">

<main class="page">
  <!-- De echo is de titel. -->
  <h1 class="echo" aria-label="Nieuwsbrief van Milk Inc. en Regi"><span aria-hidden="true">Nieuws</span><span aria-hidden="true">nieuws</span><span aria-hidden="true">nieuws</span></h1>

  <!-- Zonder script bewaart een gewone POST naar dezelfde /exec-URL de inschrijving toch. -->
  <form class="signup" id="news-form" data-regi action="https://script.google.com/macros/s/AKfycbx-hYqyZZ37_NrNOq4Yqt9d4yqra_CwzqE1DgngymrMlcxxlfFfpmpJvyNXdK0XFe17jw/exec" method="post" novalidate>
    <input type="hidden" name="type" value="news">
    <input type="hidden" name="source" value="nieuws">
    <label class="sr" for="email">Je e-mailadres</label>
    <div class="signup__row">
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off"
             spellcheck="false" maxlength="120" enterkeyhint="send" placeholder="Je e-mailadres" required
             aria-describedby="news-fine">
      <button class="btn btn--solid" type="submit">Schrijf me in</button>
    </div>
    <div class="hp" aria-hidden="true"><label>Laat dit leeg <input name="hp_x" tabindex="-1" autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore></label></div>
    <p class="status" id="news-status" data-status role="status" aria-live="polite"></p>
    <p class="fine" id="news-fine">Nieuwsbrief van Milk&nbsp;Inc. en Regi. <a href="privacy.html">Privacy</a></p>
  </form>
  <button class="again" type="button" data-again hidden>Ook inschrijven?</button>
</main>

<footer class="foot">© Regi Penxten</footer>

<script>
(function () {
  /* De foto komt pas na de rest: zo wacht inschrijven in een volle zaal nooit op de foto. */
  function load() {
    var pic = document.querySelector(".photo picture"), img = pic && pic.querySelector("img");
    if (!img) return;
    [].forEach.call(pic.querySelectorAll("source[data-srcset]"), function (s) { s.srcset = s.getAttribute("data-srcset"); });
    img.onload = function () { document.documentElement.classList.add("photo-in"); };
    img.src = img.getAttribute("data-src");
  }
  if (document.readyState === "complete") load(); else window.addEventListener("load", load);
})();
</script>
<script src="assets/js/signup.js?v=3" onerror="window.RegiSignupUnavailable=true;var f=document.querySelector('form[data-pending]');if(f){f.removeAttribute('data-pending');f.submit()}"></script>
<script>
(function () {
  /* Nieuwsbrief -> de gedeelde verzendhulp (assets/js/signup.js): outbox eerst, herpogingen,
     "ingeschreven" pas na een bevestiging van de server. */
  var S = window.RegiSignup;
  if (!S) return;
  var form = document.getElementById("news-form");
  var again = document.querySelector("[data-again]");

  var api = S.bind(form, {
    type: "news", page: "nieuws", source: "nieuws", test: /[?&]test\b/.test(location.search),
    fields: ["email"],
    check: function (v) {
      if (!S.EMAIL.test(v.email) || v.email.length > 120) return { field: "email", text: "Dat e-mailadres klopt niet. Kijk het even na." };
      return null;
    },
    busyLabel: "Even geduld…",
    text: {
      patience: "Nog even geduld, het is druk.",
      waiting: "Het is druk. We proberen het vanzelf opnieuw. Laat deze pagina open.",
      slow: "Nog niet binnen. We blijven proberen zolang deze pagina open is.",
      bad: "Dat e-mailadres klopt niet. Kijk het even na.",
      broken: "Er loopt iets mis met het formulier. Probeer het later opnieuw.",
      done: "Je bent ingeschreven. Tot in je inbox!"
    },
    onDone: function () { form.elements.email.value = ""; again.hidden = false; }
  });

  again.addEventListener("click", function () {
    api.reset();
    again.hidden = true;
    form.elements.email.focus();
  });
})();
</script>
</body>
</html>
